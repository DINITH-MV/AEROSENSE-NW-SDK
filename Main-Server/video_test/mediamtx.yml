# WildBridge six-drone WebRTC relay.
# Phones publish via WHIP: http://<host>:8889/<drone_name>/whip
# Browsers consume via WHEP: http://<host>:8889/<drone_name>/whep

logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997
apiAllowOrigins: ["*"]
apiEncryption: no

authInternalUsers:
  - user: any
    permissions:
      - action: api
      - action: publish
      - action: read
      - action: playback

webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcIPsFromInterfaces: no
webrtcAdditionalHosts:
  - 192.168.137.1
webrtcICEServers2:
  - url: stun:stun.l.google.com:19302

rtsp: no

hls: no
rtmp: no
srt: no

paths:
  # UDP/RTP mock video path: phone pushes raw H.264 RTP packets to udp://<host>:8004
  # Browser consumes via WebRTC WHEP: http://<host>:8889/drone_1_mock/whep
  drone_1_mock:
    source: udp+rtp://0.0.0.0:8004
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 0.0.0.0
      s=WildBridge Mock Video
      c=IN IP4 0.0.0.0
      t=0 0
      m=video 8004 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 profile-level-id=42e01e;packetization-mode=1
    sourceOnDemand: yes

  # drone_1 (and any other drone) accepts WHIP publishers from the phone app.
  # No static source — handled by all_others below.
  all_others:
