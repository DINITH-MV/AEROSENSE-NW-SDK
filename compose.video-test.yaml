services:
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: aerosense_mediamtx
    networks:
      - aerosense
    ports:
      - "8889:8889" # WHIP (phone → mediamtx) and WHEP (browser ← mediamtx)
      - "8189:8189/udp" # WebRTC ICE UDP
      - "9997:9997" # mediamtx API
    environment:
      - MTX_WEBRTCLOCALUDPADDRESS=${MEDIAMTX_WEBRTC_UDP_ADDRESS:-:8189}
    volumes:
      - ./Main-Server/video_test/mediamtx.yml:/mediamtx.yml:ro

  video-grid:
    image: aerosense-video-connection-test:latest
    build:
      context: ./Main-Server/video_test/webapp
    container_name: aerosense_video_connection_test
    networks:
      - aerosense
    depends_on:
      - mediamtx
    ports:
      - "8090:8090" # Video grid web UI
    environment:
      - PORT=${VIDEO_GRID_PORT:-8090}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://mediamtx:9997}
      - MEDIAMTX_WEBRTC_URL=${MEDIAMTX_WEBRTC_URL:-http://192.168.137.1:8889}
      - DRONE_NAMES=${DRONE_NAMES:-drone_1}
      - DRONE_FALLBACKS=${DRONE_FALLBACKS:-drone_1=192.168.137.194}
      - DISCOVERY_INTERVAL_MS=${DISCOVERY_INTERVAL_MS:-5000}
      - TELEMETRY_PORT=${TELEMETRY_PORT:-8081}
      - LOG_DIR=/logs
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Main-Server/video_test/logs:/logs

networks:
  aerosense:
    driver: bridge
